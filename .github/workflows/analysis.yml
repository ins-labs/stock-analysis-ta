name: Close CSV indicators
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install pinned build tools and dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-build-isolation -r requirements.txt
          python -m pip check
      - name: Independent scalar math and validation tests
        run: python -m unittest discover -s tests -v
      - name: Execute persistent repository command
        if: github.event_name == 'workflow_dispatch'
        env:
          ANALYSIS_COMMAND: ${{ vars.ANALYSIS_COMMAND }}
        run: |
          mkdir -p results
          python -m pip freeze > results/installed-versions.txt
          printf '%s\n' "$GITHUB_SHA" > results/source-commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > results/run-id.txt
          set +e
          python command_runner.py > >(tee results/stdout.txt) 2> >(tee results/stderr.txt >&2)
          status=$?
          printf '%s\n' "$status" > results/exit-code.txt
          exit "$status"
      - name: Upload analysis originals
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: close-csv-results-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 7
